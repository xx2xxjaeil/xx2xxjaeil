name: Update GitHub Stats

on:
  push:
    paths:
      - '.github/workflows/github-stats.yml'
      - 'scripts/generate-github-stats.mjs'
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    environment: PRIVATE_STATS_TOKEN
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check private stats token
        id: token
        env:
          PRIVATE_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_STATS_TOKEN" ]]; then
            echo '::notice::Set the PRIVATE_STATS_TOKEN secret in the PRIVATE_STATS_TOKEN environment to enable private GitHub Stats.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stats card
        if: steps.token.outputs.configured == 'true'
        env:
          GITHUB_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
        run: node scripts/generate-github-stats.mjs

      - name: Activate generated card in README
        if: steps.token.outputs.configured == 'true'
        run: node scripts/activate-github-stats.mjs

      - name: Commit refreshed card
        if: steps.token.outputs.configured == 'true'
        run: |
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: refresh GitHub Stats card'
          git push
