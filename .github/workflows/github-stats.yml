name: Update GitHub Stats

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    environment: PRIVATE_STATS_TOKEN
    steps:
      - uses: actions/checkout@v6

      - name: Check private stats token
        id: token
        env:
          PRIVATE_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_STATS_TOKEN" ]]; then
            echo '::notice::Set the PRIVATE_STATS_TOKEN repository secret to enable private GitHub Stats.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stats card
        if: steps.token.outputs.configured == 'true'
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: stats
          options: 'username=xx2xxjaeil&show_icons=true&hide_border=true&theme=github_dark'
          path: assets/github-stats.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Activate generated card in README
        if: steps.token.outputs.configured == 'true'
        run: node scripts/activate-github-stats.mjs

      - name: Commit refreshed card
        if: steps.token.outputs.configured == 'true'
        run: |
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: refresh GitHub Stats card'
          git push
